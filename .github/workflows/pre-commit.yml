# This is a format job. Pre-commit has a first-party GitHub action, so we use
# that: https://github.com/pre-commit/action

name: pre-commit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

# A new commit on the same branch cancels the run still in progress. The event
# name keeps manually dispatched runs out of that group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - uses: pre-commit/action@v3.0.1
      with:
        extra_args: --all-files --hook-stage manual

