name: Windows build and tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/win-build.yml'
      - '3rdparty/**'
      - 'CMakeLists.txt'
      - 'ur_client_libraryConfig.cmake'
      - 'include/**'
      - 'src/**'
      - 'examples/**'
      - 'tests/**'
      - 'resources/**'
  push:
    branches:
      - master
  schedule:
    - cron: '38 2 * * *'

# A new commit on the same branch cancels the run still in progress. The event
# name keeps scheduled and manually dispatched runs out of that group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  win-build:
    timeout-minutes: 30
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7
      - name: configure
        run: mkdir build && cd build && cmake .. -DBUILDING_TESTS=1 -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: build
        run: cmake --build build --config Debug
      - name: test
        run: cd build && ctest --output-on-failure --output-junit junit.xml -C Debug -j $env:NUMBER_OF_PROCESSORS
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: build/junit.xml
          report_type: test_results
          flags: unit-windows
          name: unit-windows
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload junit.xml
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit_windows_junit
          path: build/junit.xml
          if-no-files-found: warn
          retention-days: 10
